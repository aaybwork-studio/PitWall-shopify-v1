name: Deploy to Shopify

# Fires every time deploy-theme.sh force-pushes the compiled
# Liquid + CSS/JS assets to `shopify-theme-release` on GitHub.
on:
  push:
    branches:
      - shopify-theme-release

jobs:
  deploy:
    name: Push theme to Shopify live store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout shopify-theme-release
        uses: actions/checkout@v4
        with:
          ref: shopify-theme-release

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy theme to Shopify
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          shopify theme push \
            --store="${SHOPIFY_FLAG_STORE}" \
            --theme="${{ secrets.SHOPIFY_THEME_ID }}" \
            --allow-live \
            --nodelete \
            --no-color
